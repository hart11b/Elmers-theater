<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elmer’s Theater</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a poster wall under a sticky control bar. Detail opens as a ticket-stub sheet.
   Velvet red = actions, brass = data labels. Dark-first, like the room it lives in. */
:root{
  --bg:#0f0c0d; --surface:#181315; --surface2:#221a1d; --line:#35292d;
  --fg:#f0eae5; --muted:#a4968f; --accent:#d23b43; --accent-ink:#fff; --brass:#d6af66; --brass-ink:#1a1306;
  --shadow:0 20px 60px rgba(0,0,0,.55);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3eeed; --surface:#fff; --surface2:#ebe4e3; --line:#d8cdcb;
    --fg:#1e1517; --muted:#6c5d60; --accent:#b3262e; --accent-ink:#fff; --brass:#8a6a24; --brass-ink:#fff;
    --shadow:0 20px 60px rgba(40,20,20,.25); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3eeed; --surface:#fff; --surface2:#ebe4e3; --line:#d8cdcb;
  --fg:#1e1517; --muted:#6c5d60; --accent:#b3262e; --accent-ink:#fff; --brass:#8a6a24; --brass-ink:#fff;
  --shadow:0 20px 60px rgba(40,20,20,.25); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px 18px}
.brand h1{font:900 clamp(40px,8vw,84px)/.86 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{margin:10px 0 0;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:700 15px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* controls */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);min-height:42px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;min-height:34px}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chip.red[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:34px;max-width:100%}
.sep{width:1px;height:22px;background:var(--line)}
.fbtn{display:none}
.count{font:500 12px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;min-height:34px;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* poster wall */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding-block:22px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 280px}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.45)}
.cmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.cmeta b{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta span{font:400 11.5px var(--mono);color:var(--muted)}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;container-type:inline-size;border-radius:6px;overflow:hidden;color:#fff;background:linear-gradient(165deg,var(--c1),var(--c2));transition:transform .18s ease,box-shadow .18s ease;isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;z-index:-1}
.v0::before{background:radial-gradient(circle at 50% 36%,var(--c3) 0,var(--c3) 22%,transparent 23%),radial-gradient(circle at 50% 36%,var(--c3x) 0,transparent 62%)}
.v1::before{background:repeating-linear-gradient(112deg,transparent 0 16px,rgba(255,255,255,.07) 16px 19px),radial-gradient(80% 50% at 80% 10%,var(--c3x),transparent 70%)}
.v2::before{background:radial-gradient(120% 75% at 50% -12%,var(--c3) 0,var(--c3x) 38%,transparent 66%)}
.v3::before{background:radial-gradient(rgba(255,255,255,.2) 1.3px,transparent 1.8px) 0 0/10px 10px,radial-gradient(70% 45% at 20% 15%,var(--c3x),transparent 70%);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.v4::before{background:linear-gradient(128deg,transparent 48%,rgba(0,0,0,.28) 48.2%),linear-gradient(128deg,transparent 47.4%,var(--c3) 47.5% 48.1%,transparent 48.2%)}
.pz-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05) 62%);z-index:-1}
.pz-top{position:absolute;left:7cqw;top:7cqw;font:500 4.6cqw var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.pz-text{position:absolute;left:7cqw;right:7cqw;bottom:13cqw;display:flex;flex-direction:column;gap:3cqw}
.pz-title{font:900 12cqw/.9 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.pz-sub{font:500 4.2cqw/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.rate{position:absolute;right:6cqw;top:6cqw;font:500 4.4cqw var(--mono);padding:1cqw 2.4cqw;border:1px solid rgba(255,255,255,.7);border-radius:3px;background:rgba(0,0,0,.35)}
.fm{position:absolute;left:7cqw;right:7cqw;bottom:5cqw;display:flex;gap:1.6cqw;flex-wrap:wrap}
.fm i{font:500 3.9cqw var(--mono);font-style:normal;padding:.6cqw 2cqw;border-radius:2px;background:rgba(255,255,255,.18)}
.fm i.k4{background:var(--brass);color:var(--brass-ink);font-weight:500}
.marks{position:absolute;right:6cqw;bottom:5cqw;display:flex;gap:2cqw;font-size:6cqw;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.marks .f{color:#ffc857}.marks .s{color:#7be0a0}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.poster.hasimg .pz-text,.poster.hasimg .pz-top{display:none}
.poster.seen{filter:saturate(.55) brightness(.82)}

/* list view */
.list{display:flex;flex-direction:column;padding-block:12px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:hover{background:var(--surface)}
.row .poster{border-radius:3px}
.row .t{display:flex;flex-direction:column;min-width:0}
.row .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font:400 12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:500 11px var(--mono);padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tag.b{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.empty{padding:70px 0;text-align:center;color:var(--muted)}
.empty h2{font:800 34px var(--display);text-transform:uppercase;color:var(--fg);margin:0 0 6px}

/* overlay sheet */
.veil{position:fixed;inset:0;z-index:50;background:rgba(6,3,4,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.veil[hidden],[hidden]{display:none!important}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(980px,100%);max-height:100%;overflow:auto;position:relative;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;padding:32px}
.sheet .poster{width:100%}
.x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1;z-index:2}
.stub{display:flex;flex-direction:column;gap:16px;min-width:0}
.stub h2{font:900 clamp(34px,5vw,56px)/.92 var(--display);text-transform:uppercase;margin:0;text-wrap:balance;padding-right:36px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted);letter-spacing:.04em}
.meta .rt{color:var(--fg);border:1px solid var(--brass);padding:1px 8px;border-radius:3px}
.gen{display:flex;gap:6px;flex-wrap:wrap}
.syn{font-size:17px;line-height:1.55;max-width:62ch;margin:0}
.dir{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.dir b{color:var(--fg);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:14px}
.own{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.own h3,.more h3{margin:0;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.own .note{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nav{display:flex;gap:8px;margin-left:auto}
.more{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.minis{display:grid;grid-auto-flow:column;grid-auto-columns:88px;gap:10px;overflow-x:auto;padding-bottom:6px}
.mini{background:none;border:0;padding:0}
.picker .sheet{grid-template-columns:1fr;gap:20px}
.picker .res{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;align-items:start}
.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prow label{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* owner form */
.form{grid-template-columns:1fr!important;gap:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span,.fset legend{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);padding:0}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.chks{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font:500 12px var(--mono);cursor:pointer;min-height:34px}
.chk:has(input:checked){background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.chk input{accent-color:var(--accent)}
.ferr{color:var(--accent);font-size:13px;align-self:center}
.trow{display:flex;gap:8px;align-items:center}.trow input{flex:1;min-width:0}.trow .btn{flex:none}
.btn:disabled{opacity:.5;cursor:default}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.rts{display:inline-flex;gap:18px;align-items:center;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);text-decoration:none;color:var(--fg);margin:2px 0 14px}
.rts:hover{border-color:var(--brass)}
.rts .sc{display:flex;align-items:center;gap:8px;font:600 20px var(--body)}
.rts .sc small{display:block;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.rts svg,.rtm svg{flex:none}
.rtm{display:flex;gap:10px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.rtm span{display:inline-flex;align-items:center;gap:4px}

/* stats */
.stats{padding-block:26px;display:flex;flex-direction:column;gap:30px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.tile b{display:block;font:900 clamp(34px,5vw,52px)/1 var(--display);color:var(--fg)}
.tile span{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:26px}
.panel h3{font:800 20px var(--display);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-r{display:grid;grid-template-columns:96px minmax(0,1fr) 38px;gap:10px;align-items:center;font:400 12px var(--mono)}
.bar-r .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bar-r .tr{height:14px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar-r .tr i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar-r .tr i.br{background:var(--brass)}
.bar-r .n{text-align:right;font-variant-numeric:tabular-nums}
.foot{padding-block:30px;font:400 12px var(--mono);color:var(--muted);max-width:80ch}

@media (max-width:760px){
  .sheet{grid-template-columns:1fr;padding:20px;gap:20px}
  .sheet .poster{width:min(60%,240px);margin:0 auto}
  .picker .res{grid-template-columns:1fr}
  .picker .res .poster{width:min(55%,200px);margin:0 auto}
  .fbtn{display:inline-flex;align-items:center}
  .filters{display:none}
  .filters.open{display:flex}
  .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px}
  .row{grid-template-columns:40px minmax(0,1fr)}
  .row .tags{display:none}
  .bar-r{grid-template-columns:78px minmax(0,1fr) 34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <h1>Elmer’s <em>Theater</em></h1>
      <p id="sub">Your collection</p>
    </div>
    <div class="mast-actions">
      <button class="btn" id="addbtn" type="button" hidden>+ Add title</button>
      <button class="btn primary" id="pick" type="button">Pick tonight's movie</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-lib" aria-selected="true" aria-controls="lib">Library</button>
    <button class="tab" role="tab" id="tab-stats" aria-selected="false" aria-controls="stats">By the numbers</button>
  </div>

  <section id="lib" role="tabpanel" aria-labelledby="tab-lib">
    <div class="bar">
      <div class="bar-row">
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search title, director, genre, or plot" autocomplete="off" aria-label="Search the library"></label>
        <button class="btn fbtn" id="fbtn" type="button" aria-expanded="false">Filters</button>
        <div class="seg" role="group" aria-label="View">
          <button type="button" id="v-grid" aria-pressed="true">Posters</button>
          <button type="button" id="v-list" aria-pressed="false">List</button>
        </div>
      </div>
      <div class="filters" id="filters">
        <div class="seg" role="group" aria-label="Type" id="kinds"></div>
        <span class="sep"></span>
        <span id="fmts" style="display:contents"></span>
        <span class="sep"></span>
        <select id="loc" aria-label="Where it lives"></select>
        <select id="genre" aria-label="Genre"></select>
        <select id="rating" aria-label="Rating"></select>
        <select id="decade" aria-label="Decade"></select>
        <select id="sort" aria-label="Sort">
          <option value="title">Sort: A to Z</option>
          <option value="new">Sort: Newest</option>
          <option value="old">Sort: Oldest</option>
          <option value="long">Sort: Longest</option>
          <option value="short">Sort: Shortest</option>
        </select>
        <span class="sep"></span>
        <button class="chip red" id="c-fam" type="button" aria-pressed="false">Family night (G, PG)</button>
        <button class="chip red" id="c-foreign" type="button" aria-pressed="false">Foreign language</button>
        <button class="chip red" id="c-nonude" type="button" aria-pressed="false" title="Only titles I'm fairly confident have no nudity. Unsure titles are hidden.">Kid-safe: no nudity</button>
        <button class="chip red" id="c-unseen" type="button" aria-pressed="false">Not watched yet</button>
        <button class="chip red" id="c-fav" type="button" aria-pressed="false">Favorites</button>
        <button class="chip" id="c-reset" type="button">Reset</button>
      </div>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div id="out"></div>
  </section>

  <section id="stats" role="tabpanel" aria-labelledby="tab-stats" hidden></section>

  <p class="foot">Posters and some movie details come from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. This site uses the TMDB API but is not endorsed or certified by TMDB. A few ratings, runtimes or summaries may need a correction. Favorites and watched marks stay in this browser only.</p>
</div>

      <label class="fld" style="grid-column:1/-1"><span>Synopsis</span><textarea id="f-s">${esc(r.s)}</textarea></label>
    </div>
    <fieldset class="fset"><legend>Formats you own</legend><div class="chks">${chk('fmt',ALL_FMT,r.fmt)}</div></fieldset>
    <fieldset class="fset"><legend>Where it lives</legend><div class="chks">${chk('loc',ALL_LOC,r.loc)}</div></fieldset>
    <div class="fgrid">
      <label class="fld"><span>Copies or discs</span><input id="f-n" inputmode="numeric" value="${esc(r.n||1)}"></label>
      <label class="fld"><span>HDR (4K only)</span><select id="f-h"><option value="">None</option>${['Dolby Vision','HDR10','SDR'].map(x=>`<option${r.hdr===x?' selected':''}>${x}</option>`).join('')}</select></label>
      <label class="fld" style="grid-column:1/-1"><span>Edition notes (comma separated)</span><input id="f-e" value="${esc(r.ed.join(', '))}"></label>
    </div>
    <div class="acts">
      <button class="btn primary" type="submit" id="fsave">Save</button>
      <button class="btn" type="button" id="fcancel">Cancel</button>
      ${hasOverlay?'<button class="btn" type="button" id="frestore">Restore original</button>':''}
      ${!isNew?'<button class="btn" type="button" id="fdel">Remove from library</button>':''}
      <span class="ferr" id="ferr" role="alert"></span>
    </div></form>`;
  const err=t=>{$('#ferr').textContent=t};
  const af=$('#fauto');
  getSample().then(s=>{if(s)af.hidden=false});
  af.onclick=async()=>{
    const q=$('#f-t').value.trim(); if(!q){err('Type a title first.');$('#f-t').focus();return}
    const s=await getSample(); if(!s)return;
    af.disabled=true;af.textContent='Looking up…';err('');
    const yr=$('#f-y').value.trim();
    try{
      const res=await s(`Look up the film or series "${q}"${yr?` (${yr})`:''} and return ONLY a JSON object, no other text, with these keys:
t: official English title (string); y: release year (number); k: "movie", "tv" or "music" (concert films and albums are "music");
r: US rating, one of ${RORD.join(', ')}; rt: runtime in minutes (number, null for a series);
g: 1 to 4 genres chosen from ${GENRES.join(', ')};
d: director, or creator for a series; s: one-sentence synopsis under 140 characters, no spoilers;
lang: main spoken language if not English, otherwise "";
nd: 2 if it contains nudity, 0 if it has none, 1 if you are not sure.
If you do not recognize the title, return {"unknown":true}.`,{modelTier:'quick'});
      const j=JSON.parse((res.text.match(/\{[\s\S]*\}/)||['{}'])[0]);
      if(j.unknown||!j.t){err('Could not find that title. Fill it in by hand.');return}
      const set=(id,v)=>{if(v!==undefined&&v!==null)$(id).value=v};
      set('#f-t',j.t);set('#f-y',j.y);set('#f-rt',j.rt||'');set('#f-d',j.d);set('#f-s',j.s);set('#f-lang',j.lang||'');
      if(['movie','tv','music'].includes(j.k))$('#f-k').value=j.k;
      if(RORD.includes(j.r))$('#f-r').value=j.r;
      if(Array.isArray(j.g))$('#f-g').value=j.g.join(', ');
      if([0,1,2].includes(j.nd))$('#f-nd').value=String(j.nd);
      err('Filled in. Check it, then Save.');
    }catch(e){err(e&&e.code==='rate_limited'?'Too many lookups. Try again in a minute.':'Lookup failed. Fill it in by hand.')}
    finally{af.disabled=false;af.textContent='Auto-fill'}
  };
  $('#xs').onclick=$('#fcancel').onclick=closeSheet;
  const write=async(fn,openAfter)=>{
    if(!dbRef){err('Saving is not available in this view.');return}
    $('#fsave').disabled=true;
    try{pendingOpen=openAfter||null;await fn()}
    catch(e){pendingOpen=null;$('#fsave').disabled=false;err(e&&e.code==='invalid_argument'?'Only the owner can change the library.':'Could not save. Try again.');return}
    if(!pendingOpen)closeSheet();
  };
  $('#ef').onsubmit=e=>{
    e.preventDefault();
    const t=$('#f-t').value.trim(); if(!t){err('Add a title.');$('#f-t').focus();return}
    const num=v=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>0?n:null};
    const list=v=>v.split(',').map(s=>s.trim()).filter(Boolean);
    const ok=isNew?'new|'+Date.now():r.ok;
    const body={ok,t,y:num($('#f-y').value),r:$('#f-r').value||null,rt:num($('#f-rt').value),g:list($('#f-g').value),d:$('#f-d').value.trim(),s:$('#f-s').value.trim(),
      fmt:[...document.querySelectorAll('[name=fmt]:checked')].map(x=>x.value),hdr:$('#f-h').value||null,
      loc:[...document.querySelectorAll('[name=loc]:checked')].map(x=>x.value),n:num($('#f-n').value)||1,ed:list($('#f-e').value),k:$('#f-k').value};
    body.lang=$('#f-lang').value.trim();
    body.nd=parseInt($('#f-nd').value,10);
    if(body.lang&&!body.g.includes('International'))body.g.push('International');
    if(body.k==='tv'&&!body.g.includes('TV'))body.g.unshift('TV');
    if(!body.loc.length)body.loc=['Unsorted'];
    if(r&&r.own)body.own=r.own;
    write(()=>dbRef.doc('library/'+docId(ok)).set(body),ok);
  };
  if(hasOverlay)$('#frestore').onclick=()=>write(()=>dbRef.doc('library/'+docId(r.ok)).delete(),r.ok);
  if(!isNew)$('#fdel').onclick=function(){
    if(this.dataset.sure!=='1'){this.dataset.sure='1';this.textContent='Tap again to remove';return}
    const isBase=BASE.some(b=>b.ok===r.ok);
    write(()=>isBase?dbRef.doc('library/'+docId(r.ok)).set({ok:r.ok,_del:true}):dbRef.doc('library/'+docId(r.ok)).delete());
  };
  $('#f-t').focus({preventScroll:true});
}
$('#addbtn').addEventListener('click',e=>{sheetFrom=e.currentTarget;openForm(null)});

function applyChange(){
  const open=!veil.hidden;
  rebuild();setupFilters();render();
  if(!$('#stats').hidden)renderStats();
  if(pendingOpen){
    const m=DATA.find(x=>x.ok===pendingOpen);pendingOpen=null;
    if(m){navList=DATA;navIdx=m.id;openSheet(m.id,{keepNav:true});return}
  }
  if(open&&!veil.classList.contains('picker')&&!veil.querySelector('form'))closeSheet();
}
async function connectStore(){
  try{
    const c=window.claude; if(!c||!c.use)return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db)return;
    dbRef=db;
    isOwner=user?!!(await user.isOwner()):false;
    if(isOwner)$('#addbtn').hidden=false;
    db.collection('library').onSnapshot(snap=>{
      overlays.clear();
      snap.docs.forEach(d=>{const b=d.data();if(b&&b.ok)overlays.set(b.ok,b)});
      applyChange();
    },()=>{});
  }catch(e){}
}

BASE.forEach(m=>{m.ok=keyOf(m)});
rebuild();setupFilters();setView(S.view);
connectStore();
</script>

</body></html>
